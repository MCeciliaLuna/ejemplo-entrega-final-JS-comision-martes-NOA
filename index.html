<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulario de Registro</title>
</head>

<body>
    <header>
        <h1>Formulario de registro</h1>
    </header>
    <main>
        <form onsubmit="registro(event)">
            <label>Nombre y apellido:
                <input type="text" name="nombre-y-apellido" id="nombre-y-apellido" required>
            </label>
            <label>Edad:
                <input type="number" name="edad" id="edad" required>
            </label>
            <label>Email:
                <input type="email" name="email" id="email" required>
            </label>
            <label>
                Contraseña:
                <input type="password" name="contrasenia" id="contrasenia" required>
            </label>
            <label>
                Confirmar contraseña:
                <input type="password" name="confirmacion-contrasenia" id="confirmacion-contrasenia" required>
            </label>
            <button id="boton-creacion">Crear usuario</button>
        </form>
    </main>
    <footer>
        <p>Todos los derechos reservados a Cecilia</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
